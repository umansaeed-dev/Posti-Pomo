# Publishes the round companion to GitHub Pages.
# The Find screen needs a real https origin — browsers refuse location access to
# pages opened from a file — so Pages is what makes the compass work at all.
#
# `enablement: true` switches Pages on the first time this runs, so there is
# nothing to click in the repository settings.

name: Deploy to Pages

on:
  push:
    branches: [claude/hameenlinna-delivery-routes-6hpebw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070d">

<link rel="apple-touch-icon" href="./icon-192.png">
<title>Katinen B — Night Run</title>

<style>
/* ==========================================================================
   Katinen B — Night Run
   A one-hand, offline companion for the 00:30–06:30 Posti round in Hämeenlinna.
   Single file on purpose: it must open from Files, offline, with no network.

   Deliberately single-theme. This tool is only ever used between midnight and
   half six; a light theme would be a hazard, not a feature. Every colour is
   painted explicitly so the page holds on any host background.
   ========================================================================== */

:root{
  /* night ink — near-black with a blue bias, the colour of the sky at 01:00 */
  --ink:#05070d;
  --surface:#0e1420;
  --surface-2:#161e2e;
  --surface-3:#1e2839;
  --line:#26314a;
  --line-soft:#1a2233;
  --text:#e8edf7;
  --muted:#8c9ab6;        /* grey pulled toward the ground, not neutral */
  --dim:#5d6a86;

  --accent:#ff8200;       /* Posti orange — the only accent, spent sparingly */
  --accent-ink:#2a1400;
  --accent-soft:#3a2409;

  --good:#3ddc97;
  --good-ink:#04231a;
  --warn:#ffcc4d;
  --late:#ff5d5d;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;

  --pad:14px;
  --r:14px;
  --bar:78px;             /* fixed action bar height, reserved at page bottom */
}

/* Amber night-vision mode: no blue at all, for eyes adjusted to the dark. */
:root[data-mode="amber"]{
  --ink:#000000;
  --surface:#0d0803;
  --surface-2:#160e04;
  --surface-3:#1f1406;
  --line:#3a2408;
  --line-soft:#241705;
  --text:#ffb454;
  --muted:#a3712c;
  --dim:#6d4c1d;
  --accent:#ff7b00;
  --accent-ink:#180a00;
  --accent-soft:#3a1c00;
  --good:#ffa62b;
  --good-ink:#180a00;
  --warn:#ffc46b;
  --late:#ff6a2b;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}

/* dimmer veil — glare control at 3am, never intercepts touches */
#veil{
  position:fixed;inset:0;background:#000;opacity:0;
  pointer-events:none;z-index:90;transition:opacity .2s;
}

.app{max-width:520px;margin:0 auto;padding:0 0 calc(var(--bar) + env(safe-area-inset-bottom,0px) + 18px)}

/* ---------- mission control ---------------------------------------------- */

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 0;
}
.tb-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand .area{font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand .rid{
  font-family:var(--mono);font-size:12px;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent);
  padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.clock{font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.tb-meta{display:flex;align-items:center;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip.ok{color:var(--good);border-color:var(--good);background:transparent}
.chip.warn{color:var(--warn);border-color:var(--warn);background:transparent}
.chip.late{color:var(--late);border-color:var(--late);background:transparent}
.chip.accent{color:var(--accent);border-color:var(--accent);background:transparent}

.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.bar.complete > i{background:var(--good)}

/* ---------- tabs ---------------------------------------------------------- */

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--ink)}
.tabs button{
  flex:1;appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--sans);font-size:13px;font-weight:700;
  padding:11px 4px;cursor:pointer;letter-spacing:.02em;
}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.pane{padding:var(--pad);display:flex;flex-direction:column;gap:12px}
.pane[hidden]{display:none}

/* ---------- stop cards ---------------------------------------------------- */

.stop{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
}
.stop.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stop.done,.stop.skipped{background:transparent;border-color:var(--line-soft)}

.leg{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 13px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line-soft);
  font-size:14.5px;color:var(--muted);
}
.stop.current .leg{color:var(--text)}
.leg .ico{color:var(--accent);font-weight:800;flex:0 0 auto;line-height:1.45}

.head{display:flex;align-items:flex-start;gap:11px;padding:13px}
.seq{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  background:var(--surface-3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;margin-top:3px;
}
.stop.current .seq{background:var(--accent);color:var(--accent-ink)}
.stop.done .seq{background:transparent;border:1px solid var(--good);color:var(--good)}
.stop.skipped .seq{background:transparent;border:1px dashed var(--dim);color:var(--dim)}

.addr{flex:1;min-width:0}
.street{font-size:15px;color:var(--muted);letter-spacing:.01em}
.stop.current .street{color:var(--text)}
.nr{
  font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1.05;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.stop.done .nr,.stop.skipped .nr{font-size:22px;color:var(--dim)}
.stop.done .street,.stop.skipped .street{font-size:13px}
.badge{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;
  background:var(--accent);color:var(--accent-ink);position:relative;top:-4px;
}
.badge.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}

.tick{
  flex:0 0 auto;width:46px;height:46px;border-radius:12px;
  border:2px solid var(--line);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;color:transparent;
}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stop.done .tick{background:var(--good);border-color:var(--good);color:var(--good-ink)}

.body{padding:0 13px 13px;display:flex;flex-direction:column;gap:11px}
.stop.done .body,.stop.skipped .body{display:none}

/* The dated snapshot. Deliberately quiet — it is a hint, never an instruction. */
.usual{display:flex;flex-direction:column;gap:5px}
.usual .lbl{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);
}
.usual .papers{opacity:.72}
.usual-warn{
  font-size:13px;line-height:1.45;color:var(--muted);
  border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin-top:9px;
}

.door{
  font-size:15.5px;line-height:1.5;
  border-left:3px solid var(--accent);padding:2px 0 2px 11px;color:var(--text);
}
.door b{color:var(--accent);font-size:10.5px;font-family:var(--mono);letter-spacing:.09em;
  text-transform:uppercase;display:block;margin-bottom:2px;font-weight:700}

.papers{display:flex;flex-wrap:wrap;gap:6px}
.p{
  font-family:var(--mono);font-size:12.5px;font-weight:700;
  padding:4px 9px;border-radius:7px;background:var(--surface-3);
  border:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.p.hs{color:#ffd08a;border-color:#7a5a20;background:#2a1c07}
.p.hasa{color:#9cc4ff;border-color:#2a4a7a;background:#0b1d33}
.p.mt{color:#8fe0b0;border-color:#245a3a;background:#082214}
.p.vko,.p.tco{color:#e0a8ff;border-color:#552a7a;background:#1c0a29}
:root[data-mode="amber"] .p,
:root[data-mode="amber"] .p.hs,
:root[data-mode="amber"] .p.hasa,
:root[data-mode="amber"] .p.mt,
:root[data-mode="amber"] .p.vko,
:root[data-mode="amber"] .p.tco{
  color:var(--text);background:var(--surface-3);border-color:var(--line);
}

/* apartments */
.apts{border:1px solid var(--line);border-radius:11px;background:var(--surface-2);overflow:hidden}
.apts > summary{
  cursor:pointer;list-style:none;padding:11px 12px;
  font-size:13px;font-weight:700;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.apts > summary::-webkit-details-marker{display:none}
.apts > summary::after{content:"▾";color:var(--dim)}
.apts[open] > summary{color:var(--text);border-bottom:1px solid var(--line-soft)}
.apts[open] > summary::after{content:"▴"}
.apt-wrap{padding:4px 12px 10px}
.floor{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);padding:11px 0 5px;
}
.apt{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-top:1px solid var(--line-soft);
}
.apt .id{font-family:var(--mono);font-size:16px;font-weight:700;width:52px;font-variant-numeric:tabular-nums}
.apt .pp{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.apt .abox{
  width:34px;height:34px;border-radius:8px;border:2px solid var(--line);
  background:transparent;cursor:pointer;color:transparent;font-weight:800;font-size:17px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.apt.on .abox{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.apt.on .id{color:var(--dim);text-decoration:line-through}
.apt.unusual{opacity:.5}          /* took nothing when this was written down */
.apt.unusual.on{opacity:1}
.apt.unusual .abox{border-style:dashed}

/* my notes */
.mine{display:flex;flex-direction:column;gap:6px}
.mine label{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);
}
.mine textarea{
  width:100%;min-height:46px;resize:vertical;
  background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:15px;padding:9px 11px;line-height:1.4;
}
.mine textarea:focus{outline:none;border-style:solid;border-color:var(--accent)}
.mine textarea::placeholder{color:var(--dim)}

.navrow{display:flex;gap:8px}
.navrow a{
  flex:1;text-align:center;text-decoration:none;
  background:var(--surface-3);color:var(--text);border:1px solid var(--line);
  border-radius:11px;padding:12px 8px;font-size:14px;font-weight:700;
}
.navrow a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navrow a.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navrow a small{display:block;font-size:11px;font-weight:600;opacity:.62;margin-top:2px;letter-spacing:0}

.avg{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- whole-route view ---------------------------------------------
   The working view is one big card at a time. This is the other question a
   rider asks — "what does the whole round look like, and what's still ahead?"
   One line per stop, the leg to it underneath, the entire route on two screens. */

.viewtog{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.viewtog button{
  flex:1;appearance:none;background:transparent;border:0;cursor:pointer;
  color:var(--muted);font-family:var(--sans);font-size:13.5px;font-weight:700;padding:11px 8px;
}
.viewtog button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.viewtog button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.rlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.rrow{
  display:flex;align-items:flex-start;gap:11px;width:100%;
  padding:11px 12px;border-top:1px solid var(--line-soft);
  cursor:pointer;text-align:left;
}
.rrow:first-child{border-top:0}
.rrow.cur{background:var(--accent-soft)}
.rrow.settled .ad{color:var(--dim);text-decoration:line-through}
.rrow.settled .lg{opacity:.5}
.rrow .n{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;margin-top:2px;
  background:var(--surface-3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700;
}
.rrow.cur .n{background:var(--accent);color:var(--accent-ink)}
.rrow.settled .n{background:transparent;border:1px solid var(--good);color:var(--good)}
.rrow.skipped .n{background:transparent;border:1px dashed var(--dim);color:var(--dim)}
.rrow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .ad{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.rrow .ad em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-left:7px}
.rrow .lg{
  font-size:12.5px;color:var(--muted);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rrow .pp{display:flex;gap:4px;flex-wrap:wrap}
.rrow .pp .p{font-size:11px;padding:2px 6px;opacity:.72}
.rrow .tk{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;margin-top:1px;
  border:2px solid var(--line);background:transparent;cursor:pointer;
  color:transparent;font-size:17px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.rrow.settled .tk{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.rrow.skipped .tk{background:transparent;border-style:dashed;color:var(--dim)}
.rrow .tk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rsum{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
}

/* ---------- notices, empties --------------------------------------------- */

.note{
  border:1px solid var(--line);border-left:3px solid var(--accent);
  background:var(--surface);border-radius:0 var(--r) var(--r) 0;
  padding:12px 14px;font-size:14px;line-height:1.5;color:var(--muted);
}
.note b{color:var(--text)}
.note.warn{border-left-color:var(--warn)}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);
  padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.55;
}

/* ---------- generic controls --------------------------------------------- */

.btn{
  appearance:none;border:1px solid var(--line);background:var(--surface-3);
  color:var(--text);font-family:var(--sans);font-size:14px;font-weight:700;
  padding:12px 14px;border-radius:11px;cursor:pointer;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--late);border-color:var(--late);background:transparent}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:120px}

input[type=text],textarea,select{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 12px;width:100%;
}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea.code{font-family:var(--mono);font-size:13px;line-height:1.5;min-height:280px}

.field{display:flex;flex-direction:column;gap:5px}
.field > span{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);
}
.field small{color:var(--dim);font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:11px}
.card h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.card h3 .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600;margin-left:7px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}

.route-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;cursor:pointer;color:var(--text);font-family:var(--sans);
}
.route-row.active{border-color:var(--accent)}
.route-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.route-row .win{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.route-row .id{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em;flex:1}
.route-row .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.35}

dl.gloss{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;align-items:baseline}
dl.gloss dt{font-weight:700;color:var(--accent);font-size:14px}
dl.gloss dd{margin:0;color:var(--muted)}

ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.55;color:var(--muted)}
ol.steps b{color:var(--text)}
ul.plain{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.5;color:var(--muted)}
ul.plain b{color:var(--text)}

.slider{display:flex;align-items:center;gap:11px}
.slider input[type=range]{flex:1;accent-color:var(--accent)}
.slider span{font-family:var(--mono);font-size:11.5px;color:var(--dim);width:74px}

/* ---------- fixed action bar --------------------------------------------- */

.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(to top,var(--ink) 62%,transparent);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none;
}
.actionbar > div{width:100%;max-width:520px;display:flex;gap:9px;pointer-events:auto}
.big{
  flex:1;appearance:none;border:0;border-radius:14px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--sans);font-size:17px;font-weight:800;letter-spacing:-.01em;
  padding:17px 14px;min-height:56px;
  display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;
}
.big:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.big.finish{background:var(--good);color:var(--good-ink)}
.big[disabled]{background:var(--surface-3);color:var(--dim);cursor:default}
.big .small{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.8}
.undo{
  flex:0 0 auto;width:56px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text);border-radius:14px;font-size:19px;cursor:pointer;
}
.undo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.undo[disabled]{color:var(--dim);cursor:default}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 22px);
  background:var(--surface-3);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;

/* =========================================================================
   2. STORAGE
   Two lifetimes, kept apart on purpose:
     permanent — route data, your own door notes, your stop timings
     daily     — which stops are ticked (wiped when the date rolls over)

/* Declared before anything that runs at load time can reach for them. */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

const K = { data:"pp.data.v1", notes:"pp.notes.v1", times:"pp.times.v1", day:"pp.day.v1",
            prefs:"pp.prefs.v1", pos:"pp.pos.v1" };

function clone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }

/* localStorage is not always there. An opaque origin — a sandboxed iframe, some
   private-browsing modes — throws on the very first touch. Probe it once, and
   fall back to memory so the app still runs; it just forgets when the tab
   closes, and the Run screen says so plainly rather than pretending.

   Nothing in here may call a helper declared further down this file: this runs
   during module evaluation, when those bindings are still in the temporal dead
   zone, and a ReferenceError at this point kills the whole script. */
const MEM = Object.create(null);
let STORAGE_OK = false;
try{
  localStorage.setItem("pp.probe", "1");
  localStorage.removeItem("pp.probe");
  STORAGE_OK = true;
}catch(e){ STORAGE_OK = false; }

function load(key, fallback){
  try{
    const raw = STORAGE_OK ? localStorage.getItem(key) : (MEM[key] || null);
    return raw ? JSON.parse(raw) : clone(fallback);
  }catch(e){ return clone(fallback); }
}
function save(key, val){
  let s;
  try{ s = JSON.stringify(val); }catch(e){ return; }
  MEM[key] = s;
  if(!STORAGE_OK) return;
  try{ localStorage.setItem(key, s); }
  catch(e){ STORAGE_OK = false; }   // quota or permission lost mid-session
}

function todayKey(){
  // The shift runs 00:30–06:30, so the calendar date never splits a round.
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

let DATA  = load(K.data, SEED);
let NOTES = load(K.notes, {});
let TIMES = load(K.times, {});
let PREFS = load(K.prefs, { mode:"night", dim:0, onlyPapers:true });
let DAY   = load(K.day, null);

if(!DAY || DAY.date !== todayKey()){
  DAY = { date:todayKey(), routeId:DATA.routes[0].id, startedAt:null, lastAt:null, done:{}, skip:{}, apt:{}, history:[] };
  save(K.day, DAY);
}
if(!DATA.routes.some(r => r.id === DAY.routeId)) DAY.routeId = DATA.routes[0].id;

/* =========================================================================
   3. HELPERS
   ========================================================================= */

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function route(){ return DATA.routes.find(r => r.id === DAY.routeId) || DATA.routes[0]; }
function sid(r, s){ return r.id + ":" + s.k; }
function fullAddress(s){ return s.street + " " + s.nr + ", " + DATA.zip + " " + DATA.city; }

function hhmmToday(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d;
}
function fmtClock(d){
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m >= 60 ? Math.floor(m/60) + "h" + String(m%60).padStart(2,"0") : m + ":" + String(s).padStart(2,"0");
}
function fmtSigned(min){
  const r = Math.round(min);
  return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + " min";
}
function sumPapers(list){
  const out = {};
  for(const p of list) for(const [k,v] of Object.entries(p||{})) out[k] = (out[k]||0) + v;
  return out;
}
function countPapers(p){ return Object.values(p||{}).reduce((a,b)=>a+b, 0); }
/* Titles always read in the same order, biggest circulation first, so a glance
   at two different stops compares like with like. */
const PAPER_ORDER = ["HS", "HASA", "MT", "VKO", "TCO"];
function paperRank(k){
  const i = PAPER_ORDER.indexOf(k);
  return i < 0 ? PAPER_ORDER.length : i;
}
function papersSorted(p){
  return Object.entries(p || {})
    .filter(([,v]) => v > 0)
    .sort((a, b) => paperRank(a[0]) - paperRank(b[0]) || a[0].localeCompare(b[0]));
}
function papersLine(p){
  return papersSorted(p).map(([k,v]) => k + " " + v).join("  ");
}

let toastTimer;
function toast(msg){

  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* Which app the per-stop buttons hand off to. One phone, one preference. */
function usingApple(){ return PREFS.maps === "apple"; }

function mapsDir(addr){
  return usingApple()
    ? "https://maps.apple.com/?daddr=" + encodeURIComponent(addr) + "&dirflg=d"
    : "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(addr) + "&travelmode=driving";
}
function mapsSearch(addr){
  return usingApple()
    ? "https://maps.apple.com/?q=" + encodeURIComponent(addr)
    : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
}

/* Google takes real waypoints, but caps them — keep the first nine
   intermediates and say so on the button rather than silently dropping stops. */
const GOOGLE_WAYPOINT_CAP = 9;

function googleWholeRoute(r){
  const stops = r.stops;
  if(stops.length < 2) return null;
  const origin = encodeURIComponent(fullAddress(stops[0]));
  const dest   = encodeURIComponent(fullAddress(stops[stops.length-1]));
  // %7C rather than a bare pipe: Google tolerates the literal, but a raw "|" is
  // not legal in a URL and some in-app browsers refuse to open it.
  const mid = stops.slice(1, -1).slice(0, GOOGLE_WAYPOINT_CAP)
    .map(s => encodeURIComponent(fullAddress(s))).join("%7C");
  return "https://www.google.com/maps/dir/?api=1&origin=" + origin +
         "&destination=" + dest + (mid ? "&waypoints=" + mid : "") + "&travelmode=driving";
}

/* Apple documents a single `daddr` and no waypoints at all. What it does still
   honour is the `A+to:B+to:C` chain it inherited from the Google-Maps era —
   undocumented, so it may collapse to the first leg on some iOS versions.
   Labelled honestly on the button; Google is the reliable one for the full round. */
function appleWholeRoute(r){
  const stops = r.stops;
  if(stops.length < 2) return null;
  const chain = stops.map(s => encodeURIComponent(fullAddress(s))).join("+to:");
  return "https://maps.apple.com/?daddr=" + chain + "&dirflg=d";
}

function googleStopsShown(r){
  return Math.min(r.stops.length, GOOGLE_WAYPOINT_CAP + 2);
}

/* Both buttons, always — this is the one place worth showing each app, since
   they behave differently and only the rider's phone can settle which is better. */
function wholeRouteRow(r){
  if(r.stops.length < 2) return "";
  const shown = googleStopsShown(r);
  const capped = shown < r.stops.length;
  return '<div class="navrow wholeroute">' +
    '<a class="wr wr-g" href="' + esc(googleWholeRoute(r)) + '" target="_blank" rel="noopener">🟢 Whole route · Google' +
      (capped ? "<br><small>first " + shown + " of " + r.stops.length + " stops</small>" : "") + "</a>" +
    '<a class="wr wr-a" href="' + esc(appleWholeRoute(r)) + '" target="_blank" rel="noopener">⚫ Whole route · Apple' +
      "<br><small>all " + r.stops.length + " stops, if iOS allows</small></a>" +
    "</div>";
}

/* =========================================================================
   4. PROGRESS + PACE
   ========================================================================= */

/* A stop is settled either by delivering it or by the Pomo showing nothing for
   it tonight — both take it off the list, but they aren't the same event. */
function isSettled(r, s){ const id = sid(r, s); return !!(DAY.done[id] || DAY.skip[id]); }

function firstUndoneIndex(r){
  for(let i = 0; i < r.stops.length; i++) if(!isSettled(r, r.stops[i])) return i;
  return -1;
}

function progress(){
  const r = route();
  const total = r.stops.length;
  const done  = r.stops.filter(s => isSettled(r, s)).length;
  const skipped = r.stops.filter(s => DAY.skip[sid(r, s)]).length;
  return { r, total, done, skipped, pct: total ? Math.round(done/total*100) : 0 };
}

function pace(){
  const { r, total, done } = progress();
  const winStart = hhmmToday(r.from), winEnd = hhmmToday(r.to);
  const windowMin = (winEnd - winStart) / 60000;
  if(!total) return { state:"none", windowMin };
  if(!DAY.startedAt || !done) return { state:"idle", windowMin };

  const started = new Date(DAY.startedAt);
  const elapsedMin = (Date.now() - started) / 60000;
  const frac = done / total;
  const projectedMin = elapsedMin / frac;
  const finish = new Date(started.getTime() + projectedMin*60000);
  // Measured against how long the window IS, not when it ends — starting late
  // shouldn't make the pace chip scream, and it keeps the number meaningful
  // if you practise the round in the afternoon.
  const deltaMin = projectedMin - windowMin;

  return {
    state: deltaMin <= 0 ? "ok" : deltaMin <= 5 ? "warn" : "late",
    windowMin, elapsedMin, projectedMin, finish, deltaMin,
    perStopMin: elapsedMin / done,
    remainMin: projectedMin - elapsedMin
  };
}

/* Transcription check only — how much of the delivery book has been typed in,
   measured against the snapshot's own route totals. NOT a live bag count:
   tonight's real numbers are on the Pomo. */
function unaccounted(r){
  const entered = sumPapers(r.stops.map(s => s.papers));
  const out = {};
  for(const [k,v] of Object.entries(r.totals||{})){
    const diff = v - (entered[k]||0);
    if(diff > 0) out[k] = diff;
  }
  return out;
}

/* =========================================================================
   4b. FINDING THE DOOR
   No map service is reachable from here, and none is needed. You walk to every
   one of these doors anyway, so the phone records where you were standing when
   you tapped Delivered. Night one costs nothing; from night two the app can
   point at the door with no signal at all.

   A pinned door beats a geocoded street address for this round specifically —
   half these boxes are in back yards and courtyards tens of metres off the
   street line, which is exactly where map services drop you in the wrong place.
   ========================================================================= */

const R_EARTH = 6371000;
const rad = d => d * Math.PI / 180;

function metresBetween(a, b){
  const dLat = rad(b.lat - a.lat);
  const dLon = rad(b.lon - a.lon);
  const la1 = rad(a.lat), la2 = rad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingTo(a, b){
  const dLon = rad(b.lon - a.lon);
  const la1 = rad(a.lat), la2 = rad(b.lat);
  const y = Math.sin(dLon) * Math.cos(la2);
  const x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}
function fmtMetres(m){
  if(m == null) return "—";
  if(m < 1000) return { n: Math.round(m), u:"m" };
  return { n: (m/1000).toFixed(m < 10000 ? 1 : 0), u:"km" };
}
/* Turn a relative bearing into something you can act on without looking up. */
function clockWords(rel){
  const r = (rel + 360) % 360;
  if(r < 20 || r >= 340) return "straight ahead";
  if(r < 65)  return "ahead on your right";
  if(r < 115) return "hard right";
  if(r < 160) return "behind you, right";
  if(r < 200) return "behind you";
  if(r < 245) return "behind you, left";
  if(r < 295) return "hard left";
  return "ahead on your left";
}

let POS = load(K.pos, {});

/* A door's pin is the running mean of every fix taken there, so it tightens
   each time you visit. Wild fixes are dropped rather than averaged in. */
function recordFix(id, lat, lon, acc){
  if(acc != null && acc > 60) return false;
  const cur = POS[id];
  if(!cur){
    POS[id] = { lat, lon, n:1, acc: acc || 0 };
  }else{
    // A fix far from an established pin is a GPS glitch, not a moved building.
    if(cur.n >= 3 && metresBetween(cur, { lat, lon }) > 150) return false;
    const n = Math.min(cur.n, 12) + 1;
    POS[id] = {
      lat: cur.lat + (lat - cur.lat)/n,
      lon: cur.lon + (lon - cur.lon)/n,
      n, acc: Math.min(cur.acc || 999, acc || 999)
    };
  }
  save(K.pos, POS);
  return true;
}

const GEO = { pos:null, acc:null, at:0, heading:null, headingAt:0, err:null, watching:false };

function startGeo(){
  if(GEO.watching) return;
  if(!navigator.geolocation){ GEO.err = "This browser has no location support."; renderFind(); return; }
  GEO.watching = true;
  navigator.geolocation.watchPosition(
    p => {
      GEO.pos = { lat:p.coords.latitude, lon:p.coords.longitude };
      GEO.acc = p.coords.accuracy;
      GEO.at = Date.now();
      GEO.err = null;
      // While moving, GPS course is a fine compass and needs no permission.
      if(p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 1){
        GEO.heading = p.coords.heading; GEO.headingAt = Date.now();
      }
      if(!$("#pane-find").hidden) renderFind();
    },
    e => {
      GEO.err = e.code === 1
        ? "Location permission was refused. Allow it in the browser settings for this page, then reopen Find."
        : e.code === 3 ? "No fix yet — this can take a minute outdoors."
        : "Location unavailable right now.";
      if(!$("#pane-find").hidden) renderFind();
    },
    { enableHighAccuracy:true, maximumAge:4000, timeout:20000 }
  );
}

function onOrientation(e){
  let h = null;
  if(e.webkitCompassHeading != null) h = e.webkitCompassHeading;          // iOS
  else if(e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;        // spec
  if(h == null || isNaN(h)) return;
  GEO.heading = h; GEO.headingAt = Date.now();
  if(!$("#pane-find").hidden) paintDial();
}

async function enableCompass(){
  try{
    const D = window.DeviceOrientationEvent;
    if(D && typeof D.requestPermission === "function"){
      const r = await D.requestPermission();
      if(r !== "granted"){ toast("Compass permission refused"); return; }
    }
    window.addEventListener("deviceorientationabsolute", onOrientation, true);
    window.addEventListener("deviceorientation", onOrientation, true);
    PREFS.compass = true; save(K.prefs, PREFS);
    toast("Compass on");
    renderFind();
  }catch(e){ toast("Compass not available on this phone"); }
}

/* Where the finder is pointing: the next unsettled stop that has a pin. */
function findTarget(){
  const r = route();
  const i = firstUndoneIndex(r);
  if(i < 0) return null;
  for(let j = i; j < r.stops.length; j++){
    const s = r.stops[j], id = sid(r, s);
    if(POS[id]) return { r, s, id, ahead: j - i };
  }
  return { r, s:r.stops[i], id:sid(r, r.stops[i]), ahead:0, unpinned:true };
}

function pinnedCount(r){ return r.stops.filter(s => POS[sid(r, s)]).length; }

/* =========================================================================
   4c. DOOR PHOTOS
   A picture of the archway settles "which door" faster than any sentence.
   Kept in IndexedDB — thumbnails would blow the localStorage budget.
   ========================================================================= */

let PHOTOS = {};   // id -> dataURL, hydrated once at boot

function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open("posti-pomo", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("shots");
    rq.onsuccess = () => res(rq.result);
    rq.onerror  = () => rej(rq.error);
  });
}
async function dbPut(k, v){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("shots", "readwrite");
    tx.objectStore("shots").put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function dbDel(k){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("shots", "readwrite");
    tx.objectStore("shots").delete(k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function dbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("shots", "readonly");
    const st = tx.objectStore("shots");
    const out = {};
    const rq = st.openCursor();
    rq.onsuccess = () => {
      const c = rq.result;
      if(!c) return res(out);
      out[c.key] = c.value; c.continue();
    };
    rq.onerror = () => rej(rq.error);
  });
}

/* Down to 560px and JPEG — a door photo doesn't need to be a portrait. */
function shrink(file, max = 560){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.62));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* =========================================================================
   5. HEADER
   ========================================================================= */

function renderHeader(){
  const { r, total, done, pct } = progress();
  $("#hdrRoute").textContent = r.id;
  $("#clock").textContent = fmtClock(new Date());

  const p = pace();
  const chips = [];
  chips.push('<span class="chip">' + r.from + "–" + r.to + "</span>");
  chips.push('<span class="chip' + (total && done === total ? " ok" : "") + '">' + done + "/" + total + " stops</span>");

  const skipped = progress().skipped;
  if(skipped) chips.push('<span class="chip">' + skipped + " nothing tonight</span>");

  if(p.state === "ok" || p.state === "warn" || p.state === "late"){
    const label = p.deltaMin <= 0
      ? "on time · finish ~" + fmtClock(p.finish)
      : fmtSigned(p.deltaMin) + " over · ~" + fmtClock(p.finish);
    chips.push('<span class="chip ' + p.state + '">' + label + "</span>");
  }else if(DAY.startedAt){
    chips.push('<span class="chip">running ' + fmtDur((Date.now() - new Date(DAY.startedAt))/1000) + "</span>");
  }

  $("#hdrMeta").innerHTML = chips.join("");
  const bar = $("#hdrBar");
  bar.classList.toggle("complete", total > 0 && done === total);
  bar.firstElementChild.style.width = pct + "%";
}

function renderActionBar(){
  const { r, total, done } = progress();
  const btn = $("#bigBtn"), undo = $("#undoBtn");
  undo.disabled = !(DAY.history && DAY.history.length);

  btn.classList.remove("finish");
  if(!total){
    btn.disabled = true;
    btn.innerHTML = "No stops in " + r.id + " yet";
    return;
  }
  btn.disabled = false;
  if(done === total){
    btn.classList.add("finish");
    btn.innerHTML = "Route " + r.id + " complete ✓";
    return;
  }
  const i = firstUndoneIndex(r);
  const s = r.stops[i];
  if(!DAY.startedAt){
    btn.innerHTML = "Start route <span class=\"small\">" + esc(s.street + " " + s.nr) + "</span>";
  }else{
    btn.innerHTML = "Delivered <span class=\"small\">" + esc(s.street + " " + s.nr) + "</span>";
  }
}

/* =========================================================================
   6. RUN PANE — the screen he actually uses at 01:00
   ========================================================================= */

function renderRun(){
  const r = route();
  const pane = $("#pane-run");
  const cur = firstUndoneIndex(r);
  const parts = [];

  if(!r.stops.length){
    parts.push(
      '<div class="empty"><b style="color:var(--text)">Route ' + r.id + " has no stops yet.</b><br>" +
      "Open the Pomo, tap <b>Preview</b> on this route, and add the addresses under the " +
      "<b>Data</b> tab. Do it at home in daylight, not in the car.</div>"
    );
    pane.innerHTML = parts.join("");
    return;
  }

  // Never let someone work a whole round believing it is being remembered.
  if(!STORAGE_OK){
    parts.push(
      '<div class="note warn"><b>This page cannot save anything.</b> Ticks, notes, ' +
      "pins and photos will be gone the moment you close it, and the compass will not " +
      "work either. That happens when the app runs inside a preview frame. " +
      "Open it from its own web address instead and everything works normally.</div>"
    );
  }

  // Honest warning when the book is only partly transcribed.
  if(r.pagesTotal && r.pagesEntered < r.pagesTotal){
    parts.push(
      '<div class="note warn"><b>Page ' + r.pagesEntered + " of " + r.pagesTotal +
      " entered.</b> The stops below are only the start of this route, so the pace " +
      "estimate will look far too good. Add the remaining pages under <b>Data</b>.</div>"
    );
  }
  // The two questions a rider asks, each with its own screen.
  parts.push(
    '<div class="viewtog">' +
      '<button data-view="work" aria-pressed="' + (!PREFS.overview) + '">Working view</button>' +
      '<button data-view="all" aria-pressed="' + (!!PREFS.overview) + '">Whole route</button>' +
    "</div>"
  );

  if(PREFS.overview){
    parts.push(renderOverview(r));
    pane.innerHTML = parts.join("");
    return;
  }

  r.stops.forEach((s, i) => {
    const id = sid(r, s);
    const isDone = !!DAY.done[id];
    const isSkip = !!DAY.skip[id];
    const isCur  = i === cur;
    const prev   = i > 0 ? r.stops[i-1] : null;
    const cls    = "stop" + (isDone ? " done" : "") + (isSkip ? " skipped" : "") + (isCur ? " current" : "");
    const b = [];

    b.push('<article class="' + cls + '" id="stop-' + esc(id) + '">');

    // getting here — the previous stop's driving instruction
    if(prev && prev.next && !isDone && !isSkip){
      b.push('<div class="leg"><span class="ico">↳</span><span>' + esc(prev.next) + "</span></div>");
    }

    b.push('<div class="head">');
    b.push('<div class="seq">' + (i+1) + "</div>");
    b.push('<div class="addr">');
    b.push('<div class="street">' + esc(s.street) + "</div>");
    b.push('<div class="nr">' + esc(s.nr));
    if(s.tag) b.push('<span class="badge">' + esc(s.tag) + "</span>");
    if(isSkip) b.push('<span class="badge ghost">Nothing tonight</span>');
    else if(isCur && !s.tag) b.push('<span class="badge">Next</span>');
    b.push("</div></div>");
    b.push('<button class="tick" data-tick="' + esc(id) + '" aria-label="Mark ' +
           esc(s.street + " " + s.nr) + ' delivered">✓</button>');
    b.push("</div>");

    b.push('<div class="body">');

    if(s.at) b.push('<div class="door"><b>At the door</b>' + esc(s.at) + "</div>");

    // The snapshot, kept deliberately quiet. Tonight's papers are on the Pomo;
    // this is only here so an unfamiliar building isn't a total surprise.
    if(countPapers(s.papers)){
      b.push('<div class="usual"><span class="lbl">Usually · ' + esc(DATA.snapshot || "old snapshot") + '</span>' +
        '<span class="papers">' + papersSorted(s.papers)
          .map(([k,v]) => '<span class="p ' + k.toLowerCase() + '">' + esc(k) + " " + v + "</span>")
          .join("") + "</span></div>");
    }
    if(s.flag) b.push('<div class="note warn">' + esc(s.flag) + "</div>");

    if(s.apts && s.apts.length) b.push(renderApts(r, s, id));

    // personal note — the part that compounds over the weeks
    b.push('<div class="mine"><label for="n-' + esc(id) + '">My note — door code, bin shed, dog, ice</label>' +
           '<textarea id="n-' + esc(id) + '" data-note="' + esc(id) + '" placeholder="Add what you learned here tonight…">' +
           esc(NOTES[id] || "") + "</textarea></div>");

    const addr = fullAddress(s);
    b.push('<div class="navrow">' +
      '<a class="pri" href="' + esc(mapsDir(addr)) + '" target="_blank" rel="noopener">Navigate</a>' +
      '<a href="' + esc(mapsSearch(addr)) + '" target="_blank" rel="noopener">' +
        (usingApple() ? "Map / Look Around" : "Map / Street View") + "</a>" +
      "</div>");

    // door photo — worth more than any sentence for "which entrance?"
    b.push('<div class="shot">');
    if(PHOTOS[id]) b.push('<img src="' + PHOTOS[id] + '" alt="The door at ' + esc(s.street + " " + s.nr) + '">');
    b.push('<div style="flex:1;min-width:0"><div class="lbl">Door photo</div>' +
      '<div class="btn-row"><span class="btn camera">' + (PHOTOS[id] ? "Replace" : "Take a photo") +
        '<input type="file" accept="image/*" capture="environment" data-shot="' + esc(id) + '"></span>' +
      (PHOTOS[id] ? '<button class="btn ghost" data-unshot="' + esc(id) + '">Delete</button>' : "") +
      "</div></div></div>");

    // pin state
    const pp = POS[id];
    b.push('<div class="pinrow">' +
      '<span class="pin' + (pp ? " set" : "") + '">' +
        (pp ? "Pinned · " + pp.n + " visit" + (pp.n>1?"s":"") : "Not pinned yet") + "</span>" +
      '<button class="btn ghost" style="padding:7px 11px;font-size:12.5px" data-pin="' + esc(id) +
        '">Pin me here now</button>' +
      (pp ? '<button class="btn ghost" style="padding:7px 11px;font-size:12.5px" data-unpin="' + esc(id) + '">Clear</button>' : "") +
      "</div>");

    if(!s.tag){
      b.push('<div class="btn-row"><button class="btn ghost" data-skip="' + esc(id) +
             '">Pomo shows nothing here tonight — skip</button></div>');
    }

    const t = TIMES[id];
    if(t && t.length){
      const avg = t.reduce((a,b2)=>a+b2, 0) / t.length;
      b.push('<div class="avg">Your average here: ' + fmtDur(avg) + " over " + t.length + " run" + (t.length>1?"s":"") + "</div>");
    }

    b.push("</div></article>");
    parts.push(b.join(""));
  });

  parts.push(wholeRouteRow(r));

  pane.innerHTML = parts.join("");
}

/* The whole round on two screens: one line per stop, in book order, with the
   leg that gets you there underneath it. Tapping a row opens that stop in the
   working view — so this doubles as the way to jump around the route. */
function renderOverview(r){
  const cur = firstUndoneIndex(r);
  const b = [];

  const totals = sumPapers(r.stops.map(s => s.papers));
  const settled = r.stops.filter(s => isSettled(r, s)).length;
  const pinned = pinnedCount(r);
  b.push('<div class="rsum">' +
    "<span>" + r.stops.length + " stops</span><span>·</span>" +
    "<span>" + settled + " done</span><span>·</span>" +
    "<span>" + esc(papersLine(totals) || "no papers listed") + "</span>" +
    (pinned ? "<span>·</span><span>" + pinned + " pinned</span>" : "") +
    "</div>");

  b.push('<div class="rlist">');
  r.stops.forEach((s, i) => {
    const id = sid(r, s);
    const done = !!DAY.done[id], skip = !!DAY.skip[id];
    const prev = i > 0 ? r.stops[i-1] : null;
    const cls = "rrow" + (done || skip ? " settled" : "") + (skip ? " skipped" : "") +
                (i === cur ? " cur" : "");

    b.push('<div class="' + cls + '" data-goto="' + esc(id) + '" role="button" tabindex="0">');
    b.push('<span class="n">' + (i+1) + "</span>");
    b.push('<span class="mid">');
    b.push('<span class="ad">' + esc(s.street + " " + s.nr) +
      (s.tag ? "<em>" + esc(s.tag) + "</em>" : "") +
      (skip ? "<em>nothing tonight</em>" : i === cur ? "<em>next</em>" : "") + "</span>");
    if(countPapers(s.papers)){
      b.push('<span class="pp">' + papersSorted(s.papers)
        .map(([k,v]) => '<span class="p ' + k.toLowerCase() + '">' + esc(k) + " " + v + "</span>")
        .join("") + "</span>");
    }
    // How you get here, not what you do here — this view is about the shape.
    if(prev && prev.next) b.push('<span class="lg">↳ ' + esc(prev.next) + "</span>");
    b.push("</span>");
    b.push('<button class="tk" data-tick="' + esc(id) + '" aria-label="Mark ' +
           esc(s.street + " " + s.nr) + ' delivered">✓</button>');
    b.push("</div>");
  });
  b.push("</div>");

  b.push(wholeRouteRow(r));
  return b.join("");
}

function renderApts(r, s, id){
  const only = PREFS.onlyPapers;
  const total = s.apts.reduce((a, f) => a + f.list.length, 0);
  const withP = s.apts.reduce((a, f) => a + f.list.filter(x => x[1].length).length, 0);
  const doneN = s.apts.reduce((a, f) => a + f.list.filter(x => x[1].length && DAY.apt[id + "|" + x[0]]).length, 0);

  const b = [];
  b.push('<details class="apts"' + (withP ? " open" : "") + ">");
  b.push("<summary><span>Flats — <b>" + total + "</b> doors, " + withP + " usually take one" +
         (withP ? " · " + doneN + "/" + withP + " ticked" : "") + "</span></summary>");
  b.push('<div class="apt-wrap">');
  b.push('<div class="usual-warn">Which flats get a paper is rebuilt by Posti every night. ' +
         "Read tonight's list off the Pomo — the codes below are how it looked on " +
         esc(DATA.snapshot || "an earlier run") + ", useful for knowing which floors you normally climb.</div>");
  b.push('<div class="btn-row" style="margin-top:8px"><button class="btn ghost" data-toggle-only="1">' +
         (only ? "Show all " + total + " doors" : "Show only the " + withP + " usual ones") + "</button></div>");

  for(const f of s.apts){
    const list = only ? f.list.filter(x => x[1].length) : f.list;
    if(!list.length) continue;
    b.push('<div class="floor">' + esc(f.f) + "</div>");
    for(const [aid, papers] of list){
      const key = id + "|" + aid;
      const usual = papers.length > 0;
      const on = !!DAY.apt[key];
      // Every door is tickable. Tonight's list comes from the Pomo, and it can
      // name a flat that took nothing when this was written down.
      b.push('<div class="apt' + (usual ? "" : " unusual") + (on ? " on" : "") + '">');
      b.push('<span class="id">' + esc(aid) + "</span>");
      b.push('<span class="pp">' + papers.map(p => '<span class="p ' + p.toLowerCase() + '">' + esc(p) + "</span>").join("") + "</span>");
      b.push('<button class="abox" data-apt="' + esc(key) + '" aria-label="Mark flat ' + esc(aid) + ' delivered">✓</button>');
      b.push("</div>");
    }
  }
  b.push("</div></details>");
  return b.join("");
}

function renderFind(){
  const pane = $("#pane-find");
  const r = route();
  const t = findTarget();
  const parts = [];

  parts.push('<div class="finder">');

  // ---- the dial ----------------------------------------------------------
  parts.push(
    '<div class="dial" id="dial">' +
      '<div class="ring"></div>' +
      '<span class="card n">N</span><span class="card e">E</span>' +
      '<span class="card s">S</span><span class="card w">W</span>' +
      '<div class="arrow" id="arrow">' +
        '<svg viewBox="-50 -50 100 100" aria-hidden="true">' +
          '<path d="M0,-44 L26,32 L0,17 L-26,32 Z" fill="var(--accent)"></path>' +
        "</svg>" +
      "</div>" +
    "</div>"
  );

  // ---- the readout -------------------------------------------------------
  if(!t){
    parts.push('<div class="readout"><div class="to">Route ' + esc(r.id) + " done</div>" +
               '<div class="rel">nothing left to find</div></div>');
  }else if(t.unpinned){
    parts.push('<div class="readout"><div class="to">' + esc(t.s.street + " " + t.s.nr) +
      '<br><span>not pinned yet</span></div>' +
      '<div class="rel">deliver it once and it learns the spot</div></div>');
  }else{
    const d = GEO.pos ? metresBetween(GEO.pos, POS[t.id]) : null;
    const f = fmtMetres(d);
    const arrived = d != null && d < 25;
    parts.push('<div class="readout' + (arrived ? " arrived" : "") + '">');
    parts.push('<div class="dist">' + (d == null ? "—" : f.n + '<small>' + f.u + "</small>") + "</div>");
    parts.push('<div class="to">' + esc(t.s.street + " " + t.s.nr) +
      (t.ahead ? '<br><span>' + t.ahead + " stop" + (t.ahead>1?"s":"") + " further on</span>" : "") + "</div>");
    parts.push('<div class="rel" id="relword">' + (arrived ? "you’re there" : "waiting for a fix") + "</div>");
    parts.push("</div>");
  }

  // ---- gps quality -------------------------------------------------------
  const age = GEO.at ? (Date.now() - GEO.at)/1000 : null;
  let cls = "", txt;
  if(GEO.err) txt = GEO.err;
  else if(!GEO.pos) txt = "waiting for GPS…";
  else{
    cls = GEO.acc <= 15 ? "good" : GEO.acc <= 40 ? "" : "poor";
    txt = "GPS ±" + Math.round(GEO.acc) + " m" + (age > 20 ? " · " + Math.round(age) + "s old" : "");
  }
  parts.push('<div class="gpsline ' + cls + '"><span class="dot"></span><span>' + esc(txt) + "</span></div>");

  if(!PREFS.compass){
    parts.push('<div class="btn-row"><button class="btn" data-compass="1">Turn the compass on</button></div>');
    parts.push('<div class="note">Without the compass the arrow only points while you are moving, using your direction of travel. On foot in a courtyard, turn it on.</div>');
  }

  // ---- the door itself ---------------------------------------------------
  if(t && !t.unpinned){
    const s = t.s;
    const b = [];
    b.push('<div class="card"><h3>' + esc(s.street + " " + s.nr) + "</h3>");
    if(s.at) b.push('<div class="door"><b>At the door</b>' + esc(s.at) + "</div>");
    if(NOTES[t.id]) b.push('<div class="door"><b>My note</b>' + esc(NOTES[t.id]) + "</div>");
    if(PHOTOS[t.id]) b.push('<div class="shot"><img src="' + PHOTOS[t.id] + '" alt="The door at ' + esc(s.street + " " + s.nr) + '"></div>');
    b.push('<div class="pinrow"><span class="pin set">pinned from ' + POS[t.id].n + " visit" + (POS[t.id].n>1?"s":"") + "</span></div>");
    b.push("</div>");
    parts.push(b.join(""));
  }

  // ---- map from your own pins -------------------------------------------
  const pinned = pinnedCount(r);
  if(pinned >= 2){
    parts.push('<div class="mapwrap"><canvas id="minimap" width="900" height="700"></canvas>' +
               '<span class="cap">' + pinned + " of " + r.stops.length + " doors pinned · your own trail</span></div>");
  }

  // ---- nearest doors, for when you are simply lost ------------------------
  if(GEO.pos){
    const near = r.stops
      .filter(s => POS[sid(r, s)])
      .map(s => {
        const id = sid(r, s);
        return { s, id, d: metresBetween(GEO.pos, POS[id]), b: bearingTo(GEO.pos, POS[id]) };
      })
      .sort((a, b2) => a.d - b2.d)
      .slice(0, 6);
    if(near.length){
      parts.push('<div class="card"><h3>Nearest doors<span class="sub">from where you stand</span></h3>');
      for(const n of near){
        const f = fmtMetres(n.d);
        parts.push('<div class="near"><span class="d">' + f.n + " " + f.u + "</span>" +
          '<span class="nm">' + esc(n.s.street + " " + n.s.nr) + "</span>" +
          '<span class="bg">' + Math.round(n.b) + "°</span></div>");
      }
      parts.push("</div>");
    }
  }

  if(!pinned){
    parts.push('<div class="empty"><b style="color:var(--text)">No doors pinned on ' + esc(r.id) + " yet.</b><br>" +
      "Just run the route as normal. Every time you tap <b>Delivered</b> the phone quietly saves where you were standing, " +
      "and from the next run this screen points straight at the door — no signal needed.</div>");
  }

  parts.push("</div>");
  pane.innerHTML = parts.join("");
  paintDial();
  drawMap();
}

/* Rotate the arrow: bearing to the door, minus which way the phone faces. */
function paintDial(){
  const dial = $("#dial"), arrow = $("#arrow");
  if(!dial || !arrow) return;
  const t = findTarget();
  const haveHeading = GEO.heading != null && (Date.now() - GEO.headingAt) < 12000;

  if(!t || t.unpinned || !GEO.pos){
    dial.classList.add("stale");
    arrow.style.transform = "rotate(0deg)";
    return;
  }
  const brg = bearingTo(GEO.pos, POS[t.id]);
  const rel = haveHeading ? brg - GEO.heading : brg;
  dial.classList.toggle("stale", !haveHeading);
  arrow.style.transform = "rotate(" + rel.toFixed(1) + "deg)";

  const word = $("#relword");
  if(word){
    const d = metresBetween(GEO.pos, POS[t.id]);
    word.textContent = d < 25 ? "you’re there"
      : haveHeading ? clockWords(rel)
      : "bearing " + Math.round(brg) + "° · turn the compass on";
  }
}

/* A map with no tiles and no network: your pinned doors, the legs between
   them in delivery order, and where you are standing. */
function drawMap(){
  const cv = $("#minimap");
  if(!cv) return;
  const r = route();
  const pts = r.stops.map(s => ({ s, p: POS[sid(r, s)] })).filter(x => x.p);
  if(pts.length < 2) return;

  const all = pts.map(x => x.p).concat(GEO.pos ? [GEO.pos] : []);
  const lats = all.map(p => p.lat), lons = all.map(p => p.lon);
  const midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const kx = Math.cos(rad(midLat));                 // longitude shrinks with latitude

  // The backing store is ~2.5x the CSS width it renders at, so every size here
  // is in backing pixels: 30px of text lands as ~12px on the phone.
  const pad = 78;
  const W = cv.width, H = cv.height;
  const xs = lons.map(l => l * kx), ys = lats;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sc = Math.min((W - pad*2) / Math.max(x1-x0, 1e-9), (H - pad*2) / Math.max(y1-y0, 1e-9));
  const px = p => pad + (p.lon*kx - x0) * sc + (W - pad*2 - (x1-x0)*sc)/2;
  const py = p => H - pad - (p.lat - y0) * sc - (H - pad*2 - (y1-y0)*sc)/2;

  const css = getComputedStyle(document.documentElement);
  const c = (n, f) => (css.getPropertyValue(n) || f).trim();
  const g = cv.getContext("2d");
  g.clearRect(0, 0, W, H);
  g.fillStyle = c("--surface", "#0e1420");
  g.fillRect(0, 0, W, H);

  // legs, in delivery order
  g.strokeStyle = c("--line", "#26314a");
  g.lineWidth = 6; g.lineJoin = "round"; g.setLineDash([16, 12]);
  g.beginPath();
  pts.forEach((x, i) => i ? g.lineTo(px(x.p), py(x.p)) : g.moveTo(px(x.p), py(x.p)));
  g.stroke();
  g.setLineDash([]);

  const cur = findTarget();
  const marks = pts.map(x => {
    const isNext = cur && !cur.unpinned && sid(r, x.s) === cur.id;
    return { x, X:px(x.p), Y:py(x.p), isNext, done:isSettled(r, x.s), rad:isNext ? 28 : 22 };
  });

  // pass 1 — the markers themselves
  marks.forEach((m, i) => {
    g.beginPath(); g.arc(m.X, m.Y, m.rad, 0, Math.PI*2);
    g.fillStyle = m.isNext ? c("--accent", "#ff8200") : m.done ? c("--surface-3", "#1e2839") : c("--surface-2", "#161e2e");
    g.fill();
    g.strokeStyle = m.isNext ? c("--accent", "#ff8200") : m.done ? c("--good", "#3ddc97") : c("--line", "#26314a");
    g.lineWidth = 4; g.stroke();

    g.fillStyle = m.isNext ? c("--accent-ink", "#2a1400") : c("--muted", "#8c9ab6");
    g.font = "700 28px ui-monospace,monospace";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(i+1), m.X, m.Y + 2);
  });

  // pass 2 — labels, dodging both the other labels and every marker
  const placed = [];
  const H_LBL = 34;
  let lastStreet = null;
  g.textBaseline = "middle";
  marks.forEach(m => {
    // A round runs down one street at a time, so repeating its name on every
    // marker is noise — say it once, then just the house numbers.
    const label = m.x.s.street === lastStreet ? m.x.s.nr : m.x.s.street + " " + m.x.s.nr;
    lastStreet = m.x.s.street;

    g.font = (m.isNext ? "700 " : "600 ") + "29px system-ui,sans-serif";
    const half = g.measureText(label).width / 2;
    const lx = Math.min(W - 8 - half, Math.max(8 + half, m.X));

    const clear = y => {
      const box = { x:lx, y, w:half*2 };
      if(y < H_LBL/2 || y > H - H_LBL/2) return false;
      if(placed.some(q => Math.abs(q.x - box.x) < (q.w + box.w)/2 + 10
                       && Math.abs(q.y - box.y) < H_LBL)) return false;
      return !marks.some(o => Math.abs(o.X - box.x) < box.w/2 + o.rad + 4
                           && Math.abs(o.Y - y) < o.rad + H_LBL/2);
    };
    const above = m.Y - m.rad - 22, below = m.Y + m.rad + 22;
    const y = [above, below, above - 38, below + 38].find(clear)
              ?? Math.max(H_LBL/2, above);

    placed.push({ x:lx, y, w:half*2 });
    g.fillStyle = m.isNext ? c("--text", "#e8edf7") : c("--muted", "#8c9ab6");
    g.fillText(label, lx, y);
  });

  if(GEO.pos){
    const X = px(GEO.pos), Y = py(GEO.pos);
    // sc is pixels per degree of latitude, and a degree of latitude is ~111.32 km,
    // so metres become pixels via sc/111320. Clamped so a bad fix can't wash the map.
    if(GEO.acc){
      const rPx = Math.min(W * 0.4, Math.max(9, GEO.acc * sc / 111320));
      g.beginPath(); g.arc(X, Y, rPx, 0, Math.PI*2);
      g.fillStyle = "rgba(61,220,151,.10)"; g.fill();
    }
    g.beginPath(); g.arc(X, Y, 17, 0, Math.PI*2);
    g.fillStyle = c("--good", "#3ddc97"); g.fill();
    g.strokeStyle = c("--ink", "#05070d"); g.lineWidth = 6; g.stroke();
  }
}

function renderDayStats(){
  const r = route();
  const { total, done, skipped } = progress();
  const p = pace();
  p.skipped = skipped;
  const rows = [];
  rows.push(kv("Route", r.id));
  rows.push(kv("Window", r.from + "–" + r.to + "  (" + Math.round(p.windowMin) + " min)"));
  rows.push(kv("Started", DAY.startedAt ? fmtClock(new Date(DAY.startedAt)) : "—"));
  rows.push(kv("Stops", done + " / " + total));
  if(p.state === "ok" || p.state === "warn" || p.state === "late"){
    rows.push(kv("Average per stop", fmtDur(p.perStopMin*60)));
    rows.push(kv("Projected finish", fmtClock(p.finish) + "  (" + fmtSigned(p.deltaMin) + ")"));
    rows.push(kv("Time left at this pace", fmtDur(p.remainMin*60)));
  }
  if(p.skipped) rows.push(kv("Nothing to deliver", p.skipped + " stop" + (p.skipped>1?"s":"")));
  return rows.join("");
}
function kv(k, v){
  return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span></div>";
}

function parsePapers(str){
  const out = {};
  for(const part of String(str||"").split(/[,;]+/)){
    const m = part.trim().match(/^([A-Za-zÄÖÅäöå]+)\s*[: ]?\s*(\d+)$/);
    if(m) out[m[1].toUpperCase()] = +m[2];
  }
  return out;
}
function parseApts(str){
  const floors = [];
  for(const line of String(str||"").split(/\n+/)){
    const t = line.trim();
    if(!t) continue;
    const i = t.indexOf(":");
    if(i < 0) continue;
    const name = t.slice(0, i).trim();
    const list = [];
    for(const cell of t.slice(i+1).split(",")){
      const c = cell.trim();
      if(!c) continue;
      const bits = c.split(/\s+/);
      const aid = bits.shift();
      const rest = bits.join(" ").replace(/[-–—]/g, " ").trim();
      const papers = rest ? rest.split(/[+\s]+/).filter(Boolean).map(x => x.toUpperCase()) : [];
      list.push([aid, papers]);
    }
    if(list.length) floors.push({ f:name, list });
  }
  return floors;
}

/* =========================================================================
   10. ACTIONS
   ========================================================================= */

function markStop(id, on){
  const r = route();
  const s = r.stops.find(x => sid(r, x) === id);
  if(!s) return;

  if(on){
    if(!DAY.startedAt){
      DAY.startedAt = new Date().toISOString();
      DAY.lastAt = DAY.startedAt;
    }
    const now = Date.now();
    const from = DAY.lastAt ? new Date(DAY.lastAt).getTime() : now;
    const secs = Math.round((now - from)/1000);
    DAY.done[id] = now;
    DAY.lastAt = new Date(now).toISOString();
    DAY.history.push({ id, secs });
    // Ignore silly outliers (phone left in a pocket for an hour).
    if(secs > 5 && secs < 3600){
      TIMES[id] = (TIMES[id] || []).concat(secs).slice(-20);
      save(K.times, TIMES);
    }
    // The whole point: standing at the door is the best moment to learn where
    // the door is, and it costs you nothing to be standing there anyway.
    if(GEO.pos && (Date.now() - GEO.at) < 30000) recordFix(id, GEO.pos.lat, GEO.pos.lon, GEO.acc);
    // Tick every flat in the building along with it.
    for(const f of (s.apts || [])) for(const [aid, p] of f.list) if(p.length) DAY.apt[id + "|" + aid] = 1;
  }else{
    delete DAY.done[id];
    for(const f of (s.apts || [])) for(const [aid] of f.list) delete DAY.apt[id + "|" + aid];
  }
  save(K.day, DAY);
  renderAll();
  if(on) scrollToCurrent();
}

/* The Pomo shows nothing for this address tonight. Not a delivery, but it does
   take the stop off the list — and it's worth counting separately, because a
   run with six empty stops isn't a fast run, it's a light one. */
function skipStop(id){
  if(!DAY.startedAt){
    DAY.startedAt = new Date().toISOString();
    DAY.lastAt = DAY.startedAt;
  }
  DAY.skip[id] = Date.now();
  DAY.lastAt = new Date().toISOString();
  DAY.history.push({ id, type:"skip" });
  save(K.day, DAY);
  renderAll();
  scrollToCurrent();
}

function scrollToCurrent(){
  const r = route(), i = firstUndoneIndex(r);
  if(i < 0) return;
  const el = document.getElementById("stop-" + sid(r, r.stops[i]));
  if(el) el.scrollIntoView({ behavior:"smooth", block:"center" });
}

function undoLast(){
  const last = DAY.history.pop();
  if(!last) return;
  if(last.type === "skip"){
    delete DAY.skip[last.id];
    save(K.day, DAY);
    renderAll();
  }else{
    save(K.day, DAY);
    markStop(last.id, false);
  }
  toast("Put back");
}

function setPane(name){
  $$(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.pane === name)));
  ["run","find","routes","data","help"].forEach(p => { $("#pane-" + p).hidden = (p !== name); });
  // Built on demand: rebuilding it on every tick would wipe a half-typed stop.
  if(name === "data") renderData();
  if(name === "find"){ startGeo(); renderFind(); }
  window.scrollTo({ top:0, behavior:"auto" });
}

/* ---- one delegated click handler for the whole page --------------------- */

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tick],[data-apt],[data-route],[data-pane],[data-mode-toggle]," +
    "[data-clear-day],[data-add-stop],[data-del-stop],[data-copy-json],[data-import-json]," +
    "[data-toggle-only],[data-skip],[data-pin],[data-unpin],[data-unshot],[data-compass]," +
    "[data-view],[data-goto],[data-maps]");
  if(!t) return;
  const d = t.dataset;

  if(d.pane){ setPane(d.pane); return; }

  if(d.maps){
    PREFS.maps = d.maps;
    save(K.prefs, PREFS);
    renderAll();
    toast(d.maps === "apple" ? "Stops open in Apple Maps" : "Stops open in Google Maps");
    return;
  }

  if(d.view){
    PREFS.overview = (d.view === "all");
    save(K.prefs, PREFS);
    renderRun();
    window.scrollTo({ top:0, behavior:"auto" });
    return;
  }

  // Tapping a row in the whole-route view opens that stop in the working view.
  if(d.goto){
    PREFS.overview = false;
    save(K.prefs, PREFS);
    renderRun();
    const el = document.getElementById("stop-" + d.goto);
    if(el) el.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  if(d.compass !== undefined){ enableCompass(); return; }

  if(d.pin){
    startGeo();
    if(!GEO.pos){ toast("No GPS fix yet — give it a moment outdoors"); return; }
    if(Date.now() - GEO.at > 30000){ toast("That fix is stale — wait for a fresh one"); return; }
    const id = d.pin;
    if(recordFix(id, GEO.pos.lat, GEO.pos.lon, GEO.acc)){
      toast("Pinned to ±" + Math.round(GEO.acc) + " m");
      renderAll();
    }else{
      toast(GEO.acc > 60 ? "Fix too rough (±" + Math.round(GEO.acc) + " m) — not saved"
                         : "That is far from the saved pin — ignored as a glitch");
    }
    return;
  }

  if(d.unpin){
    delete POS[d.unpin]; save(K.pos, POS); renderAll(); toast("Pin cleared"); return;
  }

  if(d.unshot){
    dbDel(d.unshot).then(() => { delete PHOTOS[d.unshot]; renderAll(); toast("Photo deleted"); });
    return;
  }

  if(d.skip){ skipStop(d.skip); return; }

  if(d.tick){
    // Ticking a skipped stop after the fact turns it into a real delivery.
    if(DAY.skip[d.tick]) delete DAY.skip[d.tick];
    markStop(d.tick, !DAY.done[d.tick]);
    return;
  }

  if(d.apt){
    DAY.apt[d.apt] ? delete DAY.apt[d.apt] : DAY.apt[d.apt] = 1;
    save(K.day, DAY); renderRun(); return;
  }

  if(d.toggleOnly !== undefined){
    PREFS.onlyPapers = !PREFS.onlyPapers; save(K.prefs, PREFS); renderRun(); return;
  }

  if(d.route){
    DAY.routeId = d.route;
    // A fresh route gets its own clock.
    DAY.startedAt = null; DAY.lastAt = null; DAY.history = [];
    save(K.day, DAY); renderAll(); setPane("run"); return;
  }

  if(d.modeToggle !== undefined){
    PREFS.mode = PREFS.mode === "amber" ? "night" : "amber";
    save(K.prefs, PREFS); applyPrefs(); renderRoutes(); return;
  }

  if(d.clearDay !== undefined){
    if(!confirm("Clear tonight's ticks for every route? Your notes and timings stay.")) return;
    DAY = { date:todayKey(), routeId:DAY.routeId, startedAt:null, lastAt:null, done:{}, skip:{}, apt:{}, history:[] };
    save(K.day, DAY); renderAll(); toast("Cleared"); return;
  }

  if(d.addStop !== undefined){
    const street = $("#f-street").value.trim();
    const nr = $("#f-nr").value.trim();
    if(!street || !nr){ toast("Street and number are both needed"); return; }
    const r = route();
    r.stops.push({
      k: "s" + Date.now().toString(36),
      street, nr,
      at: $("#f-at").value.trim(),
      next: $("#f-next").value.trim(),
      papers: parsePapers($("#f-papers").value),
      apts: parseApts($("#f-apts").value)
    });
    if(r.pagesEntered != null) r.pagesEntered = Math.max(r.pagesEntered, 1);
    save(K.data, DATA); renderAll();
    ["f-street","f-nr","f-at","f-next","f-papers","f-apts"].forEach(i => $("#" + i).value = "");
    $("#f-street").focus();
    toast(street + " " + nr + " added");
    return;
  }

  if(d.delStop){
    const r = route();
    const i = r.stops.findIndex(s => s.k === d.delStop);
    if(i < 0) return;
    if(!confirm("Remove " + r.stops[i].street + " " + r.stops[i].nr + " from " + r.id + "?")) return;
    r.stops.splice(i, 1);
    save(K.data, DATA); renderAll(); toast("Removed");
    return;
  }

  if(d.copyJson !== undefined){
    const ta = $("#f-json");
    ta.select(); ta.setSelectionRange(0, 999999);
    navigator.clipboard ? navigator.clipboard.writeText(ta.value).then(
      () => toast("Copied — paste it somewhere safe"),
      () => toast("Select the text and copy it by hand")
    ) : toast("Select the text and copy it by hand");
    return;
  }

  if(d.importJson !== undefined){
    let parsed;
    try{ parsed = JSON.parse($("#f-json").value); }
    catch(err){ toast("That isn't valid data — check for a missing bracket"); return; }
    if(!parsed || !parsed.data || !Array.isArray(parsed.data.routes)){ toast("No routes found in that text"); return; }
    if(!confirm("Replace the routes and notes on this phone with what's in the box?")) return;
    DATA = parsed.data;
    NOTES = parsed.notes || {};
    save(K.data, DATA); save(K.notes, NOTES);
    if(!DATA.routes.some(r => r.id === DAY.routeId)) DAY.routeId = DATA.routes[0].id;
    save(K.day, DAY);
    renderAll(); toast("Loaded");
    return;
  }
});

/* The route rows are divs so the tick button can nest inside them; give them
   the keyboard behaviour a button would have had. */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest && e.target.closest("[data-goto]");
  if(!row) return;
  e.preventDefault();
  row.click();
});

/* Door photos, shrunk before they ever hit storage. */
document.addEventListener("change", async e => {
  const id = e.target.dataset ? e.target.dataset.shot : null;
  if(!id || !e.target.files || !e.target.files[0]) return;
  try{
    toast("Saving photo…");
    const url = await shrink(e.target.files[0]);
    await dbPut(id, url);
    PHOTOS[id] = url;
    renderAll();
    if(!$("#pane-find").hidden) renderFind();
    toast("Photo saved");
  }catch(err){ toast("Couldn't save that photo"); }
});

/* Notes save as they're typed, debounced so storage isn't hammered. */
let noteTimer;
document.addEventListener("input", e => {
  const id = e.target.dataset ? e.target.dataset.note : null;
  if(!id) return;
  NOTES[id] = e.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => save(K.notes, NOTES), 400);
});

$("#bigBtn").addEventListener("click", () => {
  const r = route(), i = firstUndoneIndex(r);
  if(i < 0) return;
  if(!DAY.startedAt){
    DAY.startedAt = new Date().toISOString();
    DAY.lastAt = DAY.startedAt;
    save(K.day, DAY);
    startGeo();                       // warm the fix before the first door
    renderAll(); scrollToCurrent();
    toast("Clock started · window closes " + r.to);
    return;
  }
  markStop(sid(r, r.stops[i]), true);
});
$("#undoBtn").addEventListener("click", undoLast);

/* =========================================================================
   11. BOOT
   ========================================================================= */

function applyPrefs(){
  document.documentElement.setAttribute("data-mode", PREFS.mode === "amber" ? "amber" : "night");
  $("#veil").style.opacity = (PREFS.dim || 0) / 100;
}

function renderAll(){
  renderHeader();
  renderActionBar();
  renderRun();
  renderRoutes();
  if(!$("#pane-data").hidden) renderData();
  if(!$("#pane-find").hidden) renderFind();
}

applyPrefs();
renderAll();
renderHelp();

// Photos live in IndexedDB, so they arrive a beat after first paint.
dbAll().then(all => { PHOTOS = all; renderAll(); }).catch(() => {});

// The compass needs a gesture on iOS, but if it was granted before it can just
// be re-attached. Location starts as soon as the round does, so that the first
// Delivered of the night already has a fix to save.
if(PREFS.compass){
  window.addEventListener("deviceorientationabsolute", onOrientation, true);
  window.addEventListener("deviceorientation", onOrientation, true);
}
if(DAY.startedAt) startGeo();

// Served over https (GitHub Pages), the worker keeps the whole round available
// with no signal. Opened straight from a file there is nothing to register.
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

// Keep the clock and the pace chip honest without re-rendering the list.
setInterval(renderHeader, 15000);

// A date rollover mid-session should hand back a clean sheet.
setInterval(() => {
  if(DAY.date !== todayKey()){
    DAY = { date:todayKey(), routeId:DAY.routeId, startedAt:null, lastAt:null, done:{}, skip:{}, apt:{}, history:[] };
    save(K.day, DAY); renderAll();
  }
}, 60000);
</script>
